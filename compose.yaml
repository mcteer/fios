name: fios
services:
  fios:
    build: .
    image: ${FIOS_IMAGE:-fios:current}
    restart: unless-stopped
    init: true
    depends_on:
      readiness:
        condition: service_healthy
    networks: [default, search]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FIOS_PASSWORD: ${FIOS_PASSWORD:?Run scripts/setup.sh}
      SESSION_SECRET: ${SESSION_SECRET:?Run scripts/setup.sh}
      MLX_BASE_URL: ${MLX_BASE_URL:-http://host.docker.internal:11234/v1}
      MLX_API_KEY: ${MLX_API_KEY:-}
      MLX_PEER_URLS: ${MLX_PEER_URLS:-}
      MLX_READINESS_FILE: /run/fios-readiness/peers.json
      FIOS_WEB_SEARCH: ${FIOS_WEB_SEARCH:-auto}
    volumes:
      - fios-data:/app/data
      - fios-readiness:/run/fios-readiness:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
  readiness:
    build: .
    image: ${FIOS_READINESS_IMAGE:-fios:current}
    command: [node, scripts/observe-hosts.mjs]
    restart: unless-stopped
    init: true
    environment:
      MLX_BASE_URL: ${MLX_BASE_URL:-http://host.docker.internal:11234/v1}
      MLX_API_KEY: ${MLX_API_KEY:-}
      MLX_PEER_URLS: ${MLX_PEER_URLS:-}
    volumes:
      - fios-readiness:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    healthcheck:
      test: [CMD, node, -e, "const fs=require('node:fs');const p='/app/data/peers.json';JSON.parse(fs.readFileSync(p));if(Date.now()-fs.statSync(p).mtimeMs>5000)process.exit(1)"]
      interval: 5s
      timeout: 2s
      start_period: 5s
      retries: 2
  searxng:
    build:
      context: .
      dockerfile: Dockerfile.searxng
    image: ${FIOS_SEARXNG_IMAGE:-fios-searxng:1}
    restart: unless-stopped
    init: true
    user: "977:977"
    networks: [search, search-egress]
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
      - /etc/searxng:size=1m,uid=977,gid=977,mode=0700
      - /var/cache/searxng:size=16m,uid=977,gid=977,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    cpus: 0.5
    # Never retain upstream errors/access logs that could contain queries.
    logging:
      driver: none
    healthcheck:
      test: [CMD, /usr/local/searxng/.venv/bin/python, -c, "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=2).close()"]
      interval: 30s
      timeout: 3s
      start_period: 30s
      retries: 3
  deployer:
    build:
      context: .
      dockerfile: Dockerfile.deployer
    image: fios-deployer:1
    container_name: fios-deployer
    restart: unless-stopped
    init: true
    # Explicit trusted manager: Docker API access is daemon-wide. Never add this mount to app/observer.
    user: "0:0"
    environment:
      FIOS_WEB_SEARCH: ${FIOS_WEB_SEARCH:-auto}
      FIOS_PASSWORD: ${FIOS_PASSWORD:?Run scripts/setup.sh}
      SESSION_SECRET: ${SESSION_SECRET:?Run scripts/setup.sh}
      MLX_BASE_URL: ${MLX_BASE_URL:-http://host.docker.internal:11234/v1}
      MLX_API_KEY: ${MLX_API_KEY:-}
      MLX_PEER_URLS: ${MLX_PEER_URLS:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - fios-deployment:/state
    networks: [delivery]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 512m
    cpus: 1
    stop_grace_period: 30s
    healthcheck:
      test: [CMD, node, -e, "const fs=require('node:fs');if(Date.now()-Number(fs.readFileSync('/state/heartbeat','utf8'))>1500000)process.exit(1)"]
      interval: 60s
      timeout: 2s
      start_period: 30s
      retries: 3
volumes:
  fios-data:
  fios-readiness:
  fios-deployment:
networks:
  delivery:
  search:
    internal: true
  search-egress:
