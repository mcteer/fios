name: fios
services:
  fios:
    build: .
    image: ${FIOS_IMAGE:-fios:0.1.0}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      FIOS_PASSWORD: ${FIOS_PASSWORD:?Run scripts/setup.sh}
      SESSION_SECRET: ${SESSION_SECRET:?Run scripts/setup.sh}
      MLX_BASE_URL: ${MLX_BASE_URL:-http://host.docker.internal:11234/v1}
      MLX_API_KEY: ${MLX_API_KEY:-}
      MLX_PEER_URLS: ${MLX_PEER_URLS:-}
      MLX_READINESS_FILE: /run/fios-readiness/peers.json
    volumes:
      - fios-data:/app/data
      - type: bind
        source: ${FIOS_READINESS_DIR:-./data/readiness}
        target: /run/fios-readiness
        read_only: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 1g
    cpus: 2
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
volumes:
  fios-data:
