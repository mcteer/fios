name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests (Node ${{ matrix.node }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24.15.0"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.11.17"
          enable-cache: true
      - name: Install frozen dependencies
        run: |
          npm ci
          uv lock --check
          uv sync --locked --no-editable
          git diff --exit-code -- package-lock.json uv.lock
      - name: Build frontend and run real-harness mock-backed suites
        run: |
          npm run build
          npm test
          node scripts/check-agent-boundary.mjs

  browser:
    name: Browser regressions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          cache: npm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.11.17"
          enable-cache: true
      - name: Install dependencies and Chromium
        run: |
          npm ci
          uv sync --locked --no-editable
          npx playwright install --with-deps chromium
      - name: Build and test browser flows against mock MLX
        run: |
          npm run build
          npx playwright test
      - name: Preserve mock-only failure diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-failure-diagnostics
          path: |
            test-results/
            playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  audit:
    name: Dependency audits
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
          cache: npm
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.11.17"
          enable-cache: true
      - name: Audit locked Node and Python dependencies
        run: |
          npm ci
          npm audit --audit-level=low
          uv sync --locked --no-editable
          uvx --python 3.11.17 --from pip-audit==2.10.1 pip-audit --path .venv/lib/python3.11/site-packages
      - name: Audit installed SearXNG image Python distributions (no search/network in container)
        run: |
          docker build -f Dockerfile.searxng -t fios-searxng-audit .
          docker run --rm --network none --entrypoint /usr/local/searxng/.venv/bin/python fios-searxng-audit -c 'from importlib.metadata import distributions;print("\n".join(sorted(d.metadata["Name"]+"=="+d.version for d in distributions())))' > "$RUNNER_TEMP/searxng-requirements.txt"
          uvx --python 3.11.17 --from pip-audit==2.10.1 pip-audit --no-deps --disable-pip -r "$RUNNER_TEMP/searxng-requirements.txt"

  container:
    name: ARM64 container and rollback
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      FIOS_AGENT_ROLLBACK_IMAGE: fios-ci-baseline:${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - name: Build immutable pre-harness baseline for recovery tests
        run: |
          mkdir -p "$RUNNER_TEMP/fios-ci-baseline"
          git archive 526f8c9747ac17b0ba6df5261338f0b60134d24b | tar -x -C "$RUNNER_TEMP/fios-ci-baseline"
          docker build -t "$FIOS_AGENT_ROLLBACK_IMAGE" "$RUNNER_TEMP/fios-ci-baseline"
      - name: Validate Compose with ephemeral test-only settings
        env:
          FIOS_PASSWORD: ci-only-ephemeral-workspace-password
          SESSION_SECRET: ci-only-ephemeral-session-secret-not-production
        run: docker compose --env-file /dev/null config --quiet
      - name: Test hardened image, limits, cancellation, upgrade, rollback and restore
        env:
          TMPDIR: ${{ runner.temp }}
        run: |
          node scripts/check-agent-container.mjs
          node scripts/check-searxng-container.mjs
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.11.17"
      - name: Test isolated platform runner with mock-only model pipe
        run: |
          uv sync --locked --no-editable
          tag="fios-platform-fixture:${{ github.run_id }}-${{ github.run_attempt }}"
          trap 'docker image rm "$tag" >/dev/null 2>&1 || true' EXIT
          docker build -t "$tag" .
          export FIOS_PLATFORM_TEST_BASE_IMAGE="$(docker image inspect --format '{{.Id}}' "$tag")"
          node scripts/check-platform-runner.mjs --isolated
      - name: Preserve mock-only container logs on failure
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-failure-diagnostics
          path: ${{ runner.temp }}/fios-agent-test-*.log
          retention-days: 7
          if-no-files-found: ignore

  platform:
    name: Native platform mock and process tests
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.15.0"
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: "0.13.5"
          python-version: "3.11.17"
      - name: Build native package and run disposable local checks
        run: |
          uv sync --locked --no-editable
          # This job is the macOS15 compatibility/mock lane, not a release
          # artifact build. The release producer separately enforces6.4/SDK27.
          node --input-type=module - <<'NODE'
          import {execFileSync} from 'node:child_process';
          const version=execFileSync('/usr/bin/swift',['--version'],{encoding:'utf8'});
          if(!version.includes('Apple Swift version 6.1.2 ')||!version.includes('swiftlang-6.1.2.1.2'))throw Error('Unreviewed CI compatibility toolchain');
          console.log(version.trim());
          console.log('Compatibility SDK: '+execFileSync('/usr/bin/xcrun',['--show-sdk-version'],{encoding:'utf8'}).trim());
          NODE
          swift build --package-path platform/studio
          node scripts/check-platform.mjs --mock
          node scripts/check-platform.mjs --mock --release
          node scripts/check-platform-process.mjs --isolated
          node scripts/check-platform-boot.mjs --isolated
          node scripts/check-platform-boot-state.mjs --isolated
          node scripts/check-platform-manager-execution.mjs --mock
          node scripts/check-platform-session.mjs --isolated
          node scripts/check-platform-session-control.mjs --isolated
          node scripts/check-platform-session-driver.mjs --isolated
          node scripts/check-platform-supervisor-lock.mjs --isolated
          node scripts/check-platform-supervisor-budget.mjs --isolated
          node scripts/check-platform-supervisor-publication.mjs --isolated
          node scripts/check-platform-watchdog.mjs --isolated
          node scripts/check-platform-idle.mjs --isolated 300
          plutil -lint platform/studio/deployment/*.plist
      # No SSH, native lifecycle, live inference, launchd install or host socket
      # is passed to a PR-built image. Runtime rehearsal remains separate.

  gate:
    name: CI gate
    if: always()
    needs: [tests, browser, audit, container, platform]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every prerequisite to succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const results=JSON.parse(process.env.RESULTS);for(const [name,job] of Object.entries(results)){console.log(name+": "+job.result);if(job.result!=="success")process.exitCode=1;}'
